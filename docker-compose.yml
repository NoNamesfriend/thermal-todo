services:
  thermaltodo:
    build: .
    image: "ghcr.io/nonamesfriend/thermal-todo:latest"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PRINTER_TYPE=${PRINTER_TYPE:-EPSON}
      - PRINTER_INTERFACE=${PRINTER_INTERFACE:-usb}  
      - LABEL_WIDTH_MM=${LABEL_WIDTH_MM:-80}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - JEV_API_KEY=${JEV_API_KEY:-}
      - JEV_MODEL=${JEV_MODEL:-jev-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
